<p-card [appCourseNewLine]="course" [ngClass]="{ 'is-top': course.topRated}">
  <div class="grid">
    <div class="col-10"><h2>{{ course.title | uppercase }} <i *ngIf="course.topRated"
                                                              class="pi pi-star-fill star-icon"> </i></h2></div>
    <div class="col-1"><i class="pi pi-clock" style="color: #81D4FA"></i> {{ course.duration | duration }}</div>
    <div class="col-1"><i class="pi pi-calendar"
                          style="color: #81D4FA"></i> {{ course.creationDate |  date :'d MMMM y' }}
    </div>
  </div>
  <div class="grid">
    <div class="col-10 des">{{ course.description }}</div>
    <div class="col-1 buttons-container">
      <a class="logout-link" (click)="editCourse()">
        <i class="pi pi-pencil pencil-icon"></i>
      </a>
      <a class="logout-link" (click)="deleteCourse()">
        <i class="pi pi-trash trash-icon"></i>
      </a>
    </div>
  </div>
</p-card>
