<header class="py-3 px-4 main-header">
  <app-logo></app-logo>
  <div *ngIf="isAuth; else null">
    <div class="flex align-items-center justify-content-center" >
      <div *ngIf="authUser$ | async as user">
        <i class="pi pi-user user-icon"></i> {{user[0]?.email}}
      </div>
      <a class="logout-link" (click)="onLogout()">
        <i class="pi pi-sign-out"></i> Выход
      </a>
<!--      <p-button label="Выход" styleClass=" p-button-text" icon="pi pi-sign-out" (click)="onLogout()"></p-button>-->
    </div>
  </div>
</header>
